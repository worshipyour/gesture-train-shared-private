# YOLOv5 🚀 by Ultralytics, GPL-3.0 license

# Parameters
nc: 80  # number of classes
depth_multiple: 0.5  # model depth multiple
width_multiple: 0.3  # layer channel multiple
anchors: 
  - [9,12, 11,18, 15,13, 16,19] 
  - [11,28, 15,26, 20,21, 19,29] 
  - [23,25, 15,41, 22,36, 28,30] 
  - [23,51, 35,41, 38,66, 63,53]
  # - [10,13, 16,30, 33,23]  # P3/8
  # - [30,61, 62,45, 59,119]  # P4/16
  # - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, ReLU, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, ReLU, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128, ReLU]],
   [-1, 1, Conv, [256, ReLU, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256, ReLU]],
   [-1, 1, Conv, [512, ReLU, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512, ReLU]],
   [-1, 1, Conv, [1024, ReLU, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024, ReLU]],
   [-1, 1, SPPF, [1024, ReLU, 5]],  # 9
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, ReLU, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, ReLU]],  # 13

   [-1, 1, Conv, [256, ReLU, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, ReLU]],  # 17 (P3/8-small)

   [ -1, 1, Conv, [ 128, ReLU, 1, 1 ] ],
   [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ],
   [ [ -1, 2 ], 1, Concat, [ 1 ] ],  # cat backbone P2
   [ -1, 2, C3, [ 256, ReLU] ],  # 21 (P2/4-xsmall)

   [ -1, 1, Conv, [ 128, ReLU, 3, 2 ] ],
   [ [ -1, 18, 4], 1, Concat, [ 1 ] ],  # cat head P3
   [ -1, 2, C3, [ 256, ReLU] ],  # 24 (P3/8-small)

   [-1, 1, Conv, [256, ReLU, 3, 2]],
   [[-1, 14, 6], 1, Concat, [1]],  # cat head P4
   [-1, 2, C3, [512, ReLU]],  # 27 (P4/16-medium)

   [-1, 1, Conv, [512, ReLU, 3, 2]],
   [[-1, 10], 1, Concat, [1]],  # cat head P5
   [-1, 2, C3, [1024, ReLU]],  # 30 (P5/32-large)

   [[21, 24, 27, 30], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
